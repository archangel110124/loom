# Default input bindings. Rebind by editing this file — no rebuild.
#
# Button names are winit `KeyCode` variants (KeyW, ShiftLeft, ArrowUp, Escape)
# plus MouseLeft / MouseRight, and gamepad buttons as `Pad` + gilrs's own name:
# PadSouth, PadEast, PadStart, PadLeftTrigger2. An action fires if ANY of its
# bindings fires.
#
# An `[contexts.*.axes]` table binds an action to an analog source instead —
# PadLeftStickX, PadRightStickY, and the triggers, which report travel as well
# as a press. `scale = -1.0` inverts, which is not taste: a stick pushed forward
# reports NEGATIVE Y, so every scheme that wants forward-is-positive says so.
# `dead_zone` defaults to 0.15, because a stick at rest wanders to about 0.08
# and without it a character walks across the room on its own.
#
# Keyboard and stick do not add: whichever is deflected further wins.
#
# trigger:  held (default) · pressed (the frame it goes down) · released
# modifiers: buttons that must ALSO be held. A requirement, not an exclusion —
#            plain KeyW still fires while Shift is down, because sprinting
#            forward is still moving forward.

[contexts.fly.actions]
move_forward = [{ button = "KeyW" }, { button = "ArrowUp" }]
move_back    = [{ button = "KeyS" }, { button = "ArrowDown" }]
move_left    = [{ button = "KeyA" }, { button = "ArrowLeft" }]
move_right   = [{ button = "KeyD" }, { button = "ArrowRight" }]
move_up      = [{ button = "KeyE" }, { button = "Space" }]
move_down    = [{ button = "KeyQ" }]
sprint       = [{ button = "ShiftLeft" }, { button = "ShiftRight" }]

# Hold to look, so the cursor stays usable otherwise. This is a viewer, not a
# game — taking the pointer hostage would be wrong here.
#
# RIGHT button only. The left one selects nodes and drags gizmo handles, and a
# button that both orbits the camera and moves the thing you clicked is how you
# fling a wall across the map.
look     = [{ button = "MouseRight" }]

reframe  = [{ button = "KeyF", trigger = "pressed" }]
quit     = [{ button = "Escape", trigger = "pressed" }]

# Editing (M12). The editor issues the same SceneOps the agent does, so a
# twelve-op agent transaction undoes in one press of the same key.
[contexts.edit.actions]
select_next   = [{ button = "Tab", trigger = "pressed" }]
select_prev   = [{ button = "Backquote", trigger = "pressed" }]
nudge_left    = [{ button = "KeyJ", trigger = "pressed" }]
nudge_right   = [{ button = "KeyL", trigger = "pressed" }]
nudge_forward = [{ button = "KeyI", trigger = "pressed" }]
nudge_back    = [{ button = "KeyK", trigger = "pressed" }]
nudge_up      = [{ button = "KeyU", trigger = "pressed" }]
nudge_down    = [{ button = "KeyO", trigger = "pressed" }]
undo          = [{ button = "KeyZ", modifiers = ["ControlLeft"], trigger = "pressed" }]
redo          = [{ button = "KeyY", modifiers = ["ControlLeft"], trigger = "pressed" }]
save          = [{ button = "KeyS", modifiers = ["ControlLeft"], trigger = "pressed" }]

# Gizmo modes. Digits rather than Unity's W/E/R, because W and E are already
# fly-camera movement and a viewer you cannot fly is worse than one whose
# shortcuts differ.
mode_move     = [{ button = "Digit1", trigger = "pressed" }]
mode_rotate   = [{ button = "Digit2", trigger = "pressed" }]
mode_scale    = [{ button = "Digit3", trigger = "pressed" }]

duplicate     = [{ button = "KeyD", modifiers = ["ControlLeft"], trigger = "pressed" }]
delete        = [{ button = "Delete", trigger = "pressed" }]
# Held while clicking to add to the selection rather than replace it.
extend        = [{ button = "ControlLeft" }, { button = "ControlRight" }]

# Playing, not editing. Live only while Play is running, which is also the only
# time the pointer is captured — an editor that takes the mouse hostage while
# you are trying to click a panel is unusable, and a shooter that makes you
# hold a button to look is unplayable. The two contexts want opposite things,
# so they are separate.
[contexts.play.actions]
move_forward = [{ button = "KeyW" }, { button = "ArrowUp" }]
move_back    = [{ button = "KeyS" }, { button = "ArrowDown" }]
move_left    = [{ button = "KeyA" }, { button = "ArrowLeft" }]
move_right   = [{ button = "KeyD" }, { button = "ArrowRight" }]
# Pressed, not held: holding jump must not re-fire the instant you land.
jump         = [{ button = "Space", trigger = "pressed" }, { button = "PadSouth", trigger = "pressed" }]
sprint       = [{ button = "ShiftLeft" }, { button = "ShiftRight" }, { button = "PadLeftThumb" }]
# Escape is NOT here. It is `quit` in the `fly` context, read once per frame
# whatever is running, because one key cannot mean two things at one moment:
# playing it opens the pause menu, and otherwise it closes the window. A `play`
# binding for it sat here for two milestones and nothing ever read it.
# Pressed, not held: one click is one shot. Holding to full-auto is a decision
# for the weapon script, which can count ticks; it is not the binding's job.
fire         = [{ button = "MouseLeft", trigger = "pressed" }]
# Use what you are standing at or looking at. Pressed, not held, for a stronger
# reason than `fire`: a door bound to a held key opens sixty times a second.
# `Play::set_input` edge-detects it a second time, so a rebind to `held` here is
# still one interaction per press.
interact     = [{ button = "KeyE", trigger = "pressed" }]
# The creel — the seventh digital channel, and the one that opens an inventory.
#
# **Tab is free while a game is running.** It is egui's focus key and egui
# reports it consumed unconditionally, which the viewer already un-consumes by
# hand for the editor's `select_next`; and `handle_editing` returns the moment
# Play is running, so nothing in the editor can fire from it here.
#
# Pressed, not held, for `interact`'s reason twice over: an inventory bound to a
# held key opens and shuts sixty times a second, which is a strobe.
bag          = [{ button = "Tab", trigger = "pressed" }]

# ---------------------------------------------------------------------------
# Gamepad sticks. Buttons live beside their keyboard equivalents above; only the
# analog sources need a table of their own, because a stick is not a button.
#
# The left stick drives movement in both contexts. Look is on the right stick in
# `play` and deliberately absent in `fly`: the viewer's look is hold-to-orbit on
# the right mouse button, and a stick that orbits whenever it is touched would
# fight the gizmo drag that shares the screen.
[contexts.play.axes]
move_forward = [{ axis = "PadLeftStickY", scale = -1.0 }]
move_right   = [{ axis = "PadLeftStickX" }]

[contexts.fly.axes]
move_forward = [{ axis = "PadLeftStickY", scale = -1.0 }]
move_right   = [{ axis = "PadLeftStickX" }]
# Triggers rise and fall rather than switch, so they suit a climb better than a
# pair of buttons does.
move_up      = [{ axis = "PadRightTrigger2" }]
move_down    = [{ axis = "PadLeftTrigger2" }]
