[package]
name = "loom_render"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ash = "=0.38.0"
ash-window = "=0.13.0"
egui = "=0.35.0"
egui-ash-renderer = { version = "=0.12.0", features = ["gpu-allocator"] }
egui-winit = { version = "=0.35.0", default-features = false }
glam = "=0.31.1"
gpu-allocator = { version = "=0.28.0", default-features = false, features = ["std", "vulkan"] }
loom_asset = { version = "0.0.0", path = "../loom_asset" }
loom_render_graph = { version = "0.0.0", path = "../loom_render_graph" }
png = "=0.18.1"
raw-window-handle = "=0.6.2"
winit = "=0.30.13"

# The single source of truth for analytic fields. `build.rs` generates the
# Slang half from it, so the CPU and the GPU cannot disagree about what a
# field is.
[build-dependencies]
loom_field = { version = "0.0.0", path = "../loom_field" }
# The water surface, for the same reason: `loom_water::slang` is the GPU half
# of `loom_water::sample_water`, emitted here so the two cannot be edited apart.
loom_water = { version = "0.0.0", path = "../loom_water" }
# And the terrain height lookup, which is where the water gets its depth. Build
# only, and only for `heightfield::slang` — the renderer itself never learns
# what a voxel is, and the bake that fills the buffer lives at the CLI layer.
loom_voxel = { version = "0.0.0", path = "../loom_voxel" }

# The same crate again, for the agreement test only: it evaluates the Rust side
# of the field to compare against what the generated shader computed. A
# dev-dependency rather than a dependency because nothing in the runtime
# renderer evaluates a field on the CPU.
[dev-dependencies]
loom_field = { version = "0.0.0", path = "../loom_field" }
