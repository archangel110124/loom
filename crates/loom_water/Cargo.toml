[package]
name = "loom_water"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The scene layer, for the authored `WaterBody`. Nothing else: this crate is
# the one place the wave surface is defined, and the Slang half is emitted from
# the same file — anything pulled in here becomes a build-time dependency of
# whatever generates the shader.
[dependencies]
loom_scene = { version = "0.0.0", path = "../loom_scene" }
# The frozen integer hash, for the spray's cell and slot jitter. ADR 0006: noise
# lives in `loom_field` and is never taken from a crate, because a crate bump
# must not be able to move a hash that is in a golden image.
loom_field = { version = "0.0.0", path = "../loom_field" }

# **Tests only.** W6's depth comes from `loom_voxel::heightfield`, and the
# agreement test compiles that crate's Slang half beside this one's so the two
# lookups can be compared against their Rust originals in the same run. A
# dev-dependency rather than a dependency because nothing in this crate marches
# a voxel: `sample_water` is handed a ground height and never asks where it came
# from, which is what keeps the generated shader free of the terrain system.
[dev-dependencies]
loom_voxel = { version = "0.0.0", path = "../loom_voxel" }
