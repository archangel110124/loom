[package]
name = "loom_cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
png = "=0.18.1"
loom_asset = { version = "0.0.0", path = "../loom_asset" }
loom_audio = { version = "0.0.0", path = "../loom_audio" }
loom_ecs = { version = "0.0.0", path = "../loom_ecs" }
loom_input = { version = "0.0.0", path = "../loom_input" }
loom_particles = { version = "0.0.0", path = "../loom_particles" }
loom_physics = { version = "0.0.0", path = "../loom_physics" }
loom_reflect = { version = "0.0.0", path = "../loom_reflect" }
loom_render = { version = "0.0.0", path = "../loom_render" }
loom_field = { version = "0.0.0", path = "../loom_field" }
loom_scene = { version = "0.0.0", path = "../loom_scene" }
loom_script = { version = "0.0.0", path = "../loom_script" }
loom_terrain = { version = "0.0.0", path = "../loom_terrain" }
loom_voxel = { version = "0.0.0", path = "../loom_voxel" }
serde = "=1.0.229"
serde_json = "=1.0.151"
winit = "=0.30.13"
