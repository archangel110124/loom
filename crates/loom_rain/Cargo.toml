[package]
name = "loom_rain"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Three, and each is load-bearing: the authored scalar (`loom_scene::Rain`), the
# wind the streaks lean along (P1), and the sky-occlusion march (S3). This crate
# owns none of those answers — it is the one place they are combined, so that
# "is it raining here" has exactly one implementation.
[dependencies]
loom_field = { version = "0.0.0", path = "../loom_field" }
loom_scene = { version = "0.0.0", path = "../loom_scene" }
loom_voxel = { version = "0.0.0", path = "../loom_voxel" }
