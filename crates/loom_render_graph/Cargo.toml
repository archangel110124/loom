[package]
name = "loom_render_graph"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
ash = "=0.38.0"


# **The quarantine's other inside.** Eight `unsafe` blocks, all
# `vkCmdPipelineBarrier2` — barriers are owned here by never-do #4, and issuing
# one is an ash call. Same repeat-rather-than-inherit as `loom_render`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
