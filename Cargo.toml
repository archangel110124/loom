[workspace]
resolver = "3"
members = [
    "xtask","crates/loom_agent","crates/loom_asset", "crates/loom_audio", "crates/loom_cli", "crates/loom_ecs", "crates/loom_editor", "crates/loom_field", "crates/loom_grass", "crates/loom_input", "crates/loom_particles", "crates/loom_physics", "crates/loom_rain", "crates/loom_reflect", "crates/loom_render", "crates/loom_render_graph", "crates/loom_scatter", "crates/loom_scene", "crates/loom_script", "crates/loom_terrain", "crates/loom_voxel", "crates/loom_water"]

# Crates land per milestone (see docs/design/LOOM-BUILD-BRIEF.md §3):
#   M1  loom_reflect, loom_scene
#   M2  loom_render
#   M3  loom_ecs
#   M4  loom_render_graph
#   M5  loom_asset
# Dependency rule, non-negotiable: loom_reflect and loom_scene depend on nothing
# else in the workspace; loom_agent is depended on by nothing; nothing outside
# loom_render* imports ash.

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# **The compute crates are optimised even in a debug build, and the reason is
# `cargo xtask validate`.**
#
# That gate must run debug: the validation layers are what it exists for, and
# they only switch on under `cfg!(debug_assertions)` (`loom_render::Instance`).
# But what is slow in a debug build is not the Vulkan calls — it is the CPU
# voxel bake, marching an SDF over a thousand chunks of pure arithmetic that no
# validation layer has an opinion about. Measured on `moraine.loom`: **89 s
# debug against 28 s release**, and the gate renders every scene twice, so that
# one scene cost about three minutes of a run.
#
# Optimising these four packages leaves the binary a debug build with
# `debug_assertions` on and every layer armed — it changes only how fast the
# arithmetic underneath runs. The cost is a one-time rebuild of them.
#
# **Not `opt-level = 3` on the whole dev profile**, which would strip the
# assertions and overflow checks the rest of the engine is debugged with.
[profile.dev.package.loom_voxel]
opt-level = 3
[profile.dev.package.loom_terrain]
opt-level = 3
[profile.dev.package.loom_field]
opt-level = 3
[profile.dev.package.loom_grass]
opt-level = 3
