name: green

on: [push, pull_request]

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show   # honours rust-toolchain.toml
      - run: sudo apt-get update && sudo apt-get install -y mold clang spirv-tools
      # Slang is not in any distro repo. loom_render's build.rs fails loudly
      # without it (brief §7.7 / never-do #9), so CI must install it too.
      - name: Install Slang
        run: |
          curl -sL -o slang.tar.gz \
            https://github.com/shader-slang/slang/releases/download/v2026.14.1/slang-2026.14.1-linux-x86_64-glibc-2.28.tar.gz
          mkdir -p "$HOME/slang" && tar -xzf slang.tar.gz -C "$HOME/slang"
          echo "$HOME/slang/bin" >> "$GITHUB_PATH"
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      # Third green check — `cargo xtask validate` — needs a GPU and the Vulkan
      # validation layers. Hosted runners have neither. It runs locally via
      # scripts/green.sh and is the gate that actually matters (brief §7.3).
